<svg xmlns="http://www.w3.org/2000/svg" width="160" height="112" viewBox="0 0 20 14" shape-rendering="crispEdges">
  <title>Phage hero</title>
  <defs><clipPath id="c"><rect width="20" height="14"/></clipPath></defs>
  <g clip-path="url(#c)">
    <image width="220" height="266" href="data:image/png;base64," style="image-rendering:pixelated;image-rendering:crisp-edges">
      <animate attributeName="x" values="-12;-56" keyTimes="0.0000;0.5000" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="y" values="-4;-4" keyTimes="0.0000;0.5000" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
    </image>
  </g>
</svg>